name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Sanity check the engine
        run: python -c "import scanner; print('engine', scanner.__version__)"

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean MitelPhoneFinder.spec

      - name: Smoke test the executable
        run: .\dist\MitelPhoneFinder.exe --version

      - name: Checksum
        run: |
          Get-FileHash .\dist\MitelPhoneFinder.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  MitelPhoneFinder.exe" } |
            Out-File -Encoding ascii .\dist\MitelPhoneFinder.exe.sha256
          Get-Content .\dist\MitelPhoneFinder.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: MitelPhoneFinder-windows
          path: |
            dist/MitelPhoneFinder.exe
            dist/MitelPhoneFinder.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mitel 6900 IP Phone Finder ${{ github.ref_name }}
          body_file: CHANGELOG.md
          files: |
            dist/MitelPhoneFinder.exe
            dist/MitelPhoneFinder.exe.sha256

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple silicon
            arch: arm64
          - runner: macos-13      # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Sanity check the engine
        run: python -c "import scanner; print('engine', scanner.__version__)"

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean MitelPhoneFinder.spec

      - name: Smoke test the binary
        run: ./dist/MitelPhoneFinder --version

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Mitel Phone Finder.app" \
            "MitelPhoneFinder-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "MitelPhoneFinder-macOS-${{ matrix.arch }}.zip" \
            | sed "s| .*/| |" > "MitelPhoneFinder-macOS-${{ matrix.arch }}.zip.sha256"
          cat "MitelPhoneFinder-macOS-${{ matrix.arch }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: MitelPhoneFinder-macOS-${{ matrix.arch }}
          path: |
            dist/MitelPhoneFinder-macOS-${{ matrix.arch }}.zip
            dist/MitelPhoneFinder-macOS-${{ matrix.arch }}.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mitel 6900 IP Phone Finder ${{ github.ref_name }}
          body_file: CHANGELOG.md
          files: |
            dist/MitelPhoneFinder-macOS-${{ matrix.arch }}.zip
            dist/MitelPhoneFinder-macOS-${{ matrix.arch }}.zip.sha256
